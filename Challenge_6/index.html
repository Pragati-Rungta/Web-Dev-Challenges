<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechMart - Inventory Range Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>TechMart</h1>
        <p>Inventory Range Dashboard</p>
    </header>

    <main>

        <section class="filter-section">

            <h2>Filter Products by Price</h2>

            <div class="inputs">

                <div class="input-group">
                    <label for="minPrice">Minimum Price</label>
                    <input type="number" id="minPrice" placeholder="Enter minimum price">
                </div>

                <div class="input-group">
                    <label for="maxPrice">Maximum Price</label>
                    <input type="number" id="maxPrice" placeholder="Enter maximum price">
                </div>

                <button id="searchBtn">Search</button>

            </div>

            <p id="errorMessage"></p>

        </section>


        <section class="summary-section">

            <div class="summary-card">
                <h3>Matching Products</h3>
                <p id="productCount">0</p>
            </div>

            <div class="summary-card">
                <h3>Total Inventory Value</h3>
                <p id="inventoryValue">₹0</p>
            </div>

        </section>


        <section class="products-section">

            <h2>Matching Products</h2>

            <div id="productsContainer" class="products-container">

                <p class="empty-state">
                    Enter a price range to see products.
                </p>

            </div>

        </section>

    </main>


    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
